<!doctype html>
<!-- Panel del acortador. Un solo fichero sin dependencias: el servidor lo sirve en "/" y
     sustituye __NEEDS_PASSWORD__ según tenga o no ADMIN_PASSWORD definida. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acortador · enri.me</title>
<style>
    :root {
        --noche: #0d1226;
        --panel: #151b38;
        --borde: #2a3363;
        --tinta: #e9ecfb;
        --apagado: #8e96bd;
        --estrella: #ffc857;
        --error: #ff7a6e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--tinta);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
            radial-gradient(1.5px 1.5px at 12% 22%, #ffffffb0 50%, transparent 51%),
            radial-gradient(1px 1px at 78% 14%, #ffffff70 50%, transparent 51%),
            radial-gradient(1px 1px at 32% 78%, #ffffff60 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 88% 64%, #ffffff80 50%, transparent 51%),
            radial-gradient(1px 1px at 56% 40%, #ffffff50 50%, transparent 51%),
            radial-gradient(2px 2px at 68% 88%, #ffc85766 50%, transparent 51%),
            radial-gradient(ellipse at 50% 120%, #1b2350 0%, var(--noche) 60%);
        background-color: var(--noche);
    }
    main {
        width: min(440px, 100%);
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 20px 60px #00000066;
    }
    h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 650;
        letter-spacing: 0.01em;
    }
    h1 .dominio { color: var(--estrella); }
    p.lema {
        margin: 4px 0 22px;
        color: var(--apagado);
        font-size: 0.85rem;
    }
    label {
        display: block;
        margin: 14px 0 6px;
        font-size: 0.8rem;
        color: var(--apagado);
    }
    label .opcional { opacity: 0.65; font-weight: 400; }
    input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--noche);
        color: var(--tinta);
        font-size: 0.95rem;
    }
    input:focus-visible, button:focus-visible {
        outline: 2px solid var(--estrella);
        outline-offset: 2px;
    }
    button {
        margin-top: 18px;
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: var(--estrella);
        color: #221a05;
        font-size: 0.95rem;
        font-weight: 650;
        cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    /* El código se diseñó para dictarse por voz (sin 0/O/1/l/I): aquí se muestra a lo grande,
       espaciado para leerse letra a letra. Es el protagonista del panel. */
    #resultado {
        display: none;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--borde);
        text-align: center;
    }
    #codigo {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 2.1rem;
        letter-spacing: 0.22em;
        color: var(--estrella);
        margin: 4px 0 10px;
        word-break: break-all;
    }
    #enlace {
        color: var(--apagado);
        font-size: 0.85rem;
        word-break: break-all;
    }
    #copiar {
        margin-top: 12px;
        background: transparent;
        border: 1px solid var(--borde);
        color: var(--tinta);
        font-weight: 500;
    }
    #aviso, #aviso-metricas {
        display: none;
        margin: 14px 0 0;
        color: var(--error);
        font-size: 0.85rem;
    }
    /* Pestañas Acortar/Métricas: mismo panel, dos herramientas. */
    nav.pestanas { display: flex; gap: 8px; margin-top: 18px; }
    nav.pestanas button {
        margin: 0;
        flex: 1;
        padding: 8px;
        background: transparent;
        border: 1px solid var(--borde);
        color: var(--apagado);
        font-weight: 500;
    }
    nav.pestanas button[aria-selected="true"] {
        background: var(--noche);
        color: var(--estrella);
        border-color: var(--estrella);
    }
    #totales { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    #totales span {
        border: 1px solid var(--borde);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.8rem;
        color: var(--apagado);
    }
    #totales b { color: var(--estrella); font-weight: 650; }
    /* La tabla pivota día × evento; con muchos eventos desborda el panel → scroll horizontal. */
    .tabla-envoltura { overflow-x: auto; margin-top: 14px; }
    #tabla { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
    #tabla th, #tabla td {
        padding: 6px 8px;
        text-align: right;
        border-bottom: 1px solid var(--borde);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }
    #tabla th { color: var(--apagado); font-weight: 500; }
    #tabla th:first-child, #tabla td:first-child {
        text-align: left;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    #sin-datos { display: none; margin-top: 16px; color: var(--apagado); font-size: 0.85rem; }
    @media (prefers-reduced-motion: no-preference) {
        #resultado.visible { animation: aparecer 0.25s ease-out; }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: none; }
        }
    }
</style>
</head>
<body>
<main>
    <h1>Acortador <span class="dominio" id="base-host"></span></h1>
    <p class="lema">Enlaces cortos para mis dominios. El código se dicta letra a letra.</p>

    <nav class="pestanas" role="tablist">
        <button type="button" id="tab-acortar" role="tab" aria-selected="true">Acortar</button>
        <button type="button" id="tab-metricas" role="tab" aria-selected="false">Métricas</button>
    </nav>

    <div id="vista-acortar" role="tabpanel">
    <form id="formulario">
        <label for="url">URL larga</label>
        <input id="url" name="url" type="url" required placeholder="https://astroleap.enri.me/…" autofocus>

        <label for="prefix">Proyecto <span class="opcional">(opcional — aparece en el enlace: /astroleap/…)</span></label>
        <input id="prefix" name="prefix" type="text" pattern="[a-z0-9\-]{1,32}" maxlength="32"
               placeholder="astroleap" autocapitalize="off" autocomplete="off" spellcheck="false"
               title="minúsculas, dígitos y guiones (máx. 32)">

        <label for="password" id="label-password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password">

        <button type="submit" id="acortar">Acortar</button>
    </form>

    <p id="aviso" role="alert"></p>

    <section id="resultado" aria-live="polite">
        <div id="codigo"></div>
        <a id="enlace" target="_blank" rel="noopener"></a>
        <button type="button" id="copiar">Copiar enlace</button>
    </section>
    </div>

    <div id="vista-metricas" role="tabpanel" hidden>
        <form id="form-metricas">
            <label for="sitio">Proyecto</label>
            <input id="sitio" name="sitio" type="text" required pattern="[a-z0-9_\-]{1,32}" maxlength="32"
                   value="astroleap" autocapitalize="off" autocomplete="off" spellcheck="false"
                   title="minúsculas, dígitos, guiones y guion bajo (máx. 32)">

            <label for="dias">Días hacia atrás</label>
            <input id="dias" name="dias" type="number" min="1" max="365" value="30" required>

            <label for="password-metricas" id="label-password-metricas">Contraseña</label>
            <input id="password-metricas" name="password-metricas" type="password" autocomplete="current-password">

            <button type="submit" id="consultar">Consultar</button>
        </form>

        <p id="aviso-metricas" role="alert"></p>
        <p id="sin-datos">Sin balizas en ese periodo. Los contadores aparecen cuando el juego las manda.</p>

        <div id="totales" aria-live="polite"></div>
        <div class="tabla-envoltura"><table id="tabla"></table></div>
    </div>
</main>

<script>
    const NEEDS_PASSWORD = __NEEDS_PASSWORD__;

    const $ = id => document.getElementById(id);
    $('base-host').textContent = location.host;

    // La contraseña se recuerda en este navegador para no teclearla en cada enlace.
    // Las dos pestañas comparten la misma (es la ADMIN_PASSWORD del servidor).
    if (!NEEDS_PASSWORD) {
        for (const id of ['label-password', 'password', 'label-password-metricas', 'password-metricas']) {
            $(id).style.display = 'none';
        }
    } else {
        $('password').value = localStorage.getItem('acortador_password') || '';
        $('password-metricas').value = $('password').value;
    }

    // Pestañas: un solo panel, dos herramientas (crear enlaces / leer métricas).
    function mostrarPestana(activa) {
        const acortar = activa === 'acortar';
        $('vista-acortar').hidden = !acortar;
        $('vista-metricas').hidden = acortar;
        $('tab-acortar').setAttribute('aria-selected', String(acortar));
        $('tab-metricas').setAttribute('aria-selected', String(!acortar));
    }
    $('tab-acortar').addEventListener('click', () => mostrarPestana('acortar'));
    $('tab-metricas').addEventListener('click', () => mostrarPestana('metricas'));

    const MENSAJES = {
        url_not_allowed: 'Ese dominio no está en la lista blanca del servidor.',
        bad_prefix: 'El proyecto solo admite minúsculas, dígitos y guiones (y no puede ser "api" ni "healthz").',
        unauthorized: 'Contraseña incorrecta.',
        rate_limited: 'Demasiadas peticiones seguidas. Espera un minuto y reintenta.',
        bad_json: 'La petición llegó mal formada. Recarga la página y reintenta.'
    };

    $('formulario').addEventListener('submit', async ev => {
        ev.preventDefault();
        const boton = $('acortar');
        boton.disabled = true;
        $('aviso').style.display = 'none';
        $('resultado').style.display = 'none';
        $('resultado').classList.remove('visible');
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (NEEDS_PASSWORD) {
                headers['Authorization'] = 'Bearer ' + $('password').value;
                localStorage.setItem('acortador_password', $('password').value);
            }
            const respuesta = await fetch('/api/shorten', {
                method: 'POST',
                headers,
                body: JSON.stringify({ url: $('url').value.trim(), prefix: $('prefix').value.trim().toLowerCase() })
            });
            const datos = await respuesta.json();
            if (!respuesta.ok) {
                mostrarAviso(MENSAJES[datos.error] || 'El servidor respondió con un error (' + respuesta.status + ').');
                return;
            }
            $('codigo').textContent = datos.code;
            $('enlace').textContent = datos.shortUrl;
            $('enlace').href = datos.shortUrl;
            $('resultado').style.display = 'block';
            $('resultado').classList.add('visible');
        } catch (e) {
            mostrarAviso('No se pudo contactar con el servidor.');
        } finally {
            boton.disabled = false;
        }
    });

    function mostrarAviso(texto) {
        $('aviso').textContent = texto;
        $('aviso').style.display = 'block';
    }

    $('copiar').addEventListener('click', async () => {
        await navigator.clipboard.writeText($('enlace').textContent);
        $('copiar').textContent = 'Copiado';
        setTimeout(() => { $('copiar').textContent = 'Copiar enlace'; }, 1500);
    });

    // ---- Métricas: GET /api/metrics/:site?days=N (Bearer) pintado como totales + tabla
    // día × evento. Todo con textContent/createElement: nada del servidor entra como HTML.
    $('form-metricas').addEventListener('submit', async ev => {
        ev.preventDefault();
        const boton = $('consultar');
        boton.disabled = true;
        $('aviso-metricas').style.display = 'none';
        $('sin-datos').style.display = 'none';
        $('totales').replaceChildren();
        $('tabla').replaceChildren();
        try {
            const headers = {};
            if (NEEDS_PASSWORD) {
                headers['Authorization'] = 'Bearer ' + $('password-metricas').value;
                localStorage.setItem('acortador_password', $('password-metricas').value);
                $('password').value = $('password-metricas').value;
            }
            const sitio = $('sitio').value.trim().toLowerCase();
            const dias = Math.max(1, Math.min(365, parseInt($('dias').value, 10) || 30));
            const respuesta = await fetch(`/api/metrics/${encodeURIComponent(sitio)}?days=${dias}`, { headers });
            const datos = await respuesta.json();
            if (!respuesta.ok) {
                mostrarAvisoMetricas(MENSAJES[datos.error] || 'El servidor respondió con un error (' + respuesta.status + ').');
                return;
            }
            pintarMetricas(datos);
        } catch (e) {
            mostrarAvisoMetricas('No se pudo contactar con el servidor.');
        } finally {
            boton.disabled = false;
        }
    });

    function mostrarAvisoMetricas(texto) {
        $('aviso-metricas').textContent = texto;
        $('aviso-metricas').style.display = 'block';
    }

    function pintarMetricas(datos) {
        // Eventos ordenados por total (lo que más pasa, primero); pg manda BIGINT como string.
        const eventos = Object.keys(datos.totals).sort((a, b) => Number(datos.totals[b]) - Number(datos.totals[a]));
        if (!eventos.length) { $('sin-datos').style.display = 'block'; return; }

        for (const evento of eventos) {
            const chip = document.createElement('span');
            const total = document.createElement('b');
            total.textContent = Number(datos.totals[evento]).toLocaleString('es');
            chip.append(evento + ' ', total);
            $('totales').appendChild(chip);
        }

        const porDia = new Map(); // "día|evento" → cuenta; los días llegan ya en orden DESC
        const dias = [];
        for (const fila of datos.events) {
            if (!porDia.has(fila.day)) { porDia.set(fila.day, true); dias.push(fila.day); }
            porDia.set(fila.day + '|' + fila.event, Number(fila.count));
        }

        const cabecera = document.createElement('tr');
        for (const texto of ['Día', ...eventos]) {
            const th = document.createElement('th');
            th.textContent = texto;
            cabecera.appendChild(th);
        }
        $('tabla').appendChild(cabecera);
        for (const dia of dias) {
            const tr = document.createElement('tr');
            const tdDia = document.createElement('td');
            tdDia.textContent = dia;
            tr.appendChild(tdDia);
            for (const evento of eventos) {
                const td = document.createElement('td');
                const n = porDia.get(dia + '|' + evento);
                td.textContent = n === undefined ? '' : n.toLocaleString('es');
                tr.appendChild(td);
            }
            $('tabla').appendChild(tr);
        }
    }
</script>
</body>
</html>
